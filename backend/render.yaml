services:
  - type: web
    name: safespace-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn safespace_project.asgi:application --worker-class daphne.executors.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: safespace_project.settings
      - key: DATABASE_URL
        fromDatabase:
          name: safespace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safespace-redis
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: safespace-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://safespace-frontend.onrender.com

databases:
  - name: safespace-db
    databaseName: safespace
    user: safespace

services:
  - type: redis
    name: safespace-redis
    maxmemoryPolicy: allkeys-lru
